# syntax=docker/sandbox-kit:3
schemaVersion: '3'
kind: mixin
displayName: standard-74th
description: Standard kit for @74th
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    install:
      allow:
      - raw.githubusercontent.com:443
      - archive.ubuntu.com
      - '*.archive.ubuntu.com'
      - security.ubuntu.com
      - ports.ubuntu.com
      - deb.debian.org
      - security.debian.org
      - registry.npmjs.org:443
      - pypi.org
      - files.pythonhosted.org
- type: com.docker.sandbox/lifecycle@1
  config:
    install:
    - description: Install My .bashrc
      command: curl https://raw.githubusercontent.com/74th/dotfiles/refs/heads/master/bashrc/docker-sandbox.bashrc >> ~/.bashrc
      user: '1000'
      env: [HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY, http_proxy, https_proxy, all_proxy, no_proxy]
    - description: Install peco
      command: apt-get update && apt-get install -y peco
      user: '0'
      env: [HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY, http_proxy, https_proxy, all_proxy, no_proxy]
    - command: npm install -g @fission-ai/openspec@latest
      user: '1000'
      description: Install openspec
      env: [HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY, http_proxy, https_proxy, all_proxy, no_proxy]
    - command: uv tool install pre-commit
      user: '1000'
      description: Install pre-commit
      env: [HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY, http_proxy, https_proxy, all_proxy, no_proxy]
