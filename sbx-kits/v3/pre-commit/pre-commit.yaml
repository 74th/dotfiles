# syntax=docker/sandbox-kit:3
schemaVersion: '3'
kind: mixin
version: 1.0.0
displayName: pre-commit
description: Installs pre-commit for Git hook management
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    install:
      allow:
      - pypi.org
      - files.pythonhosted.org
    runtime:
      allow:
      - pypi.org
      - files.pythonhosted.org
- type: com.docker.sandbox/lifecycle@1
  config:
    install:
    - command: uv tool install pre-commit
      user: '1000'
      description: Install pre-commit
      env: [HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY, http_proxy, https_proxy, all_proxy, no_proxy]
