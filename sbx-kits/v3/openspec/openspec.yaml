# syntax=docker/sandbox-kit:3
schemaVersion: '3'
kind: mixin
displayName: OpenSpec
description: https://github.com/Fission-AI/openspec
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    install:
      allow:
      - registry.npmjs.org:443
- type: com.docker.sandbox/lifecycle@1
  config:
    install:
    - command: npm install -g @fission-ai/openspec@latest
      user: '1000'
      description: Install openspec
      env: [HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY, http_proxy, https_proxy, all_proxy, no_proxy]
