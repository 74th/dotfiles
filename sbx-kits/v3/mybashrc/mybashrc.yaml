# syntax=docker/sandbox-kit:3
schemaVersion: '3'
kind: mixin
displayName: My .bashrc
description: https://github.com/74th/dotfiles/blob/master/bashrc/docker-sandbox.bashrc
capabilities:
- type: com.docker.sandbox/lifecycle@1
  config:
    install:
    - description: Install My .bashrc
      command: curl https://raw.githubusercontent.com/74th/dotfiles/refs/heads/master/bashrc/docker-sandbox.bashrc >> ~/.bashrc
      user: '1000'
      env: [HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY, http_proxy, https_proxy, all_proxy, no_proxy]
